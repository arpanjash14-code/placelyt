
spring.application.name=placelyt-backend

spring.datasource.url=jdbc:mysql://localhost:3306/placelyt
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.profiles.active=openrouter

# AI Configuration
ai.enabled=${AI_ENABLED:true}
ai.provider=${AI_PROVIDER:development}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:}
ai.base-url=${AI_BASE_URL:}
ai.connect-timeout=5000
ai.read-timeout=15000

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Email Configuration
app.mail.from=${MAIL_USERNAME:}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
